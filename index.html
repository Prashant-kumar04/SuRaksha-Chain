<!DOCTYPE html>

  <script>
    // Suppress benign Vite dev-server WebSocket errors in sandboxed iframe environment
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event && event.reason;
      var msg = (reason && (reason.message || reason.stack || reason)) ? String(reason.message || reason) : '';
      if (msg.includes('WebSocket') || msg.includes('vite')) {
        event.preventDefault();
      }
    });
    window.addEventListener('error', function(event) {
      var msg = (event && (event.message || event.error)) ? String(event.message || event.error) : '';
      if (msg.includes('WebSocket') || msg.includes('[vite]')) {
        event.preventDefault();
      }
    });
  </script>
</head>
<body class="bg-[#F7F6F3] text-[#232323] antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
